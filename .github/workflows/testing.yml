name: Django Testing

on:
    push:
        branches: [ "main", "dev" ]
    pull_request:
        branches: [ "main", "dev" ]

jobs:
  build:

    runs-on: ubuntu-latest
    defaults: 
        run:
            working-directory: ./evergreen

    steps:
    - uses: actions/checkout@v2
    - name: Set up Python 3.12
      uses: actions/setup-python@v2
      with:
        python-version: 3.12
    - name: Install environment
      run: |
        python -m pip install --upgrade pip
        pip install poetry
        poetry install

    - name: Django Testing
      run: |
        poetry run python manage.py test eg_app/teest/*